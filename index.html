<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="NYX — 静かな夜に、自分と向き合う。3Dタロット占い。" />
  <title>NYX — 静かな夜に、自分と向き合う。</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar" id="topbar" hidden>
    <button class="brand" id="btn-home" aria-label="最初に戻る">NYX</button>
    <span class="step" id="step-label"></span>
  </header>

  <main id="app">
    <!-- 1. Opening -->
    <section class="screen" id="s-opening" aria-label="オープニング">
      <div class="opening">
        <div class="logo-ring" aria-hidden="true"></div>
        <h1 class="logo">NYX</h1>
        <p class="tagline">静かな夜に、自分と向き合う。</p>
        <button class="btn" id="btn-start">Start</button>
      </div>
    </section>

    <!-- 2. 占い方法選択 -->
    <section class="screen" id="s-method" aria-label="占い方法の選択">
      <div class="inner">
        <p class="eyebrow">Choose a spread</p>
        <h2 class="title">占い方法を選んでください</h2>
        <div class="methods" id="methods"></div>
      </div>
    </section>

    <!-- 3-4. 召喚・シャッフル -->
    <section class="screen" id="s-shuffle" aria-label="シャッフル">
      <div class="inner center">
        <div class="deck" id="deck" aria-hidden="true"></div>
        <p class="caption" id="shuffle-caption">カードを呼び寄せています</p>
        <button class="btn ghost" id="btn-skip" hidden>スキップ</button>
      </div>
    </section>

    <!-- 5. カード選択 -->
    <section class="screen" id="s-select" aria-label="カード選択">
      <div class="inner center">
        <p class="eyebrow" id="select-eyebrow"></p>
        <h2 class="title" id="select-title"></h2>
        <p class="caption" id="select-hint">心に引っかかるカードを、ひとつずつ選んでください。</p>
        <div class="fan" id="fan" role="group" aria-label="カードの山"></div>
      </div>
    </section>

    <!-- 6. Reveal -->
    <section class="screen" id="s-reveal" aria-label="カードを開く">
      <div class="inner center reveal-inner">
        <p class="caption" id="reveal-hint">カードをタップして、ひとつずつ開きます。</p>
        <div class="table" id="table"></div>
        <p class="status" id="reveal-status" aria-live="polite"></p>
        <div class="actions">
          <button class="btn ghost" id="btn-openall">すべて開く</button>
          <button class="btn" id="btn-result" disabled>結果を読む</button>
        </div>
      </div>
    </section>

    <!-- 7. 結果 -->
    <section class="screen scroll" id="s-result" aria-label="占い結果">
      <div class="result" id="result"></div>
    </section>
  </main>

  <noscript><p style="padding:2rem;color:#f1ede4">NYXの利用にはJavaScriptが必要です。</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
